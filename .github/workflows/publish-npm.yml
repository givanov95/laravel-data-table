name: Publish npm package

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  # OIDC за npm Trusted Publishing — без npm токен и без OTP
  id-token: write

jobs:
  publish:
    name: Publish @givanov95/vue-data-table
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted Publishing иска npm >= 11.5.1, а Node 22 идва с npm 10
      - name: Update npm
        run: npm install -g "npm@^11.5.1"

      # package.json е стоял на 3.0.0 през v3.1.0–v3.3.0 — таг без bump не се публикува
      - name: Tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package.json version $version"
            exit 1
          fi

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

      - name: Publish
        run: npm publish
